name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --frozen --extra dev --extra anthropic
      - run: uv run ruff check .
      - run: uv run pytest -q

  docker:
    name: docker build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build only: proves the shipped image (Dockerfile + lockfile) still
      # assembles. Publishing belongs to the deploy pipeline, not CI.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false

  terraform:
    name: terraform fmt and validate
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive deploy/terraform
      # -backend=false: validate the configuration without touching remote
      # state (CI has no business holding state credentials).
      - run: terraform -chdir=deploy/terraform/gcp init -backend=false
      - run: terraform -chdir=deploy/terraform/gcp validate

  gate-self-check:
    name: eval gate has teeth
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --frozen
      # Fails the job if the naive baseline ever passes: a gate that accepts anything is not a gate.
      - run: uv run deliveryops-eval --baseline-check

  eval-gate:
    name: eval gate (real model)
    needs: gate-self-check
    runs-on: ubuntu-latest
    # Skipped on forks, where the secret is unavailable. Requires the check to be marked
    # "required" in branch protection for it to actually block merges.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      DELIVERYOPS_LLM: anthropic
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DELIVERYOPS_MODEL: ${{ vars.DELIVERYOPS_MODEL || 'claude-sonnet-4-6' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv sync --frozen --extra anthropic
      - name: Check for model credentials
        id: creds
        run: |
          if [ -n "${ANTHROPIC_API_KEY}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Real-model gate skipped::ANTHROPIC_API_KEY is not set." \
                 "Add it as a repository secret to make this job a real gate."
          fi
      # Skips (does not fail, does not pass silently) when no key is configured: the job cannot
      # claim a model was evaluated if none was.
      - name: Run the eval gate against the real model
        if: steps.creds.outputs.available == 'true'
        run: uv run deliveryops-eval --judge --trials 3 --report eval-report.json
      - uses: actions/upload-artifact@v4
        if: always() && steps.creds.outputs.available == 'true'
        with: { name: eval-report, path: eval-report.json }
