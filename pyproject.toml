[build-system]
# uv only installs a project (and therefore its console scripts) when it has a build backend.
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deliveryops"
version = "1.0.0"
description = "Agentic SDLC platform: agents do lifecycle work, humans own the gates, evals decide what ships."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "psycopg[binary,pool]>=3.2",
  "langgraph>=1.2",
  "mcp>=2.3",
]

[project.optional-dependencies]
# One code path (init_chat_model) for every provider; install the extra for yours.
anthropic = ["langchain>=1.1", "langchain-anthropic>=1.0"]
openai = ["langchain>=1.1", "langchain-openai>=1.0"]
google = ["langchain>=1.1", "langchain-google-genai>=2.0"]
postgres = ["langgraph-checkpoint-postgres>=2.0"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "vulture>=2.14"]

[project.scripts]
deliveryops-eval = "deliveryops.evals.runner:main"
deliveryops-api = "deliveryops.api.main:run"
deliveryops-mcp = "deliveryops.mcp_server.server:main"
deliveryops-knowledge = "deliveryops.knowledge.ingest:main"
deliveryops-worker = "deliveryops.orchestrator.worker:main"
deliveryops-migrate = "deliveryops.db.migrate:main"
deliveryops-approve = "deliveryops.console.approve:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]

[tool.vulture]
# `uv run vulture` reports dead code. The ignore list is only framework-registered names:
# FastAPI route handlers, MCP tool functions, dataclass fields consumed via to_dict(),
# TypedDict keys consumed through Annotated reducers, and http.server handler hooks.
paths = ["src"]
min_confidence = 60
ignore_names = [
    "health", "submit", "list_runs", "get_run", "decide", "get_patch", "get_summary",
    "dashboard", "metrics", "run_status", "area", "spent_usd", "errors",
    "graph",  # langgraph.json entry point (consumed by the LangGraph CLI, not Python)
    "do_GET", "log_message",  # BaseHTTPRequestHandler hooks (worker's health server)
]
